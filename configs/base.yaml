# =============================================================================
# base.yaml -- default configuration for all experiments
# Override any of these values in an experiment-specific config file.
# =============================================================================

physics:
  R: 1.0            # pipe radius [m]
  L: 20.0           # pipe length [m] (must be >= entry length for chosen Re)
  nu: 0.01          # kinematic viscosity [m^2/s]
  Re_range:
    min: 100.0      # minimum Re sampled during training
    max: 500.0      # maximum Re sampled during training

model:
  type: "mlp"
  hidden_layer_depth: 4
  hidden_layer_width: 64
  activation: "tanh"

sampling:
  num_interior_points: 2000   # collocation points sampled in the 2D domain

training:
  epochs: 10000
  learning_rate: 0.001
  optimizer: "adam"
  loss_weight_physics: 1.0        # axial momentum PDE residual
  loss_weight_continuity: 1.0     # continuity equation residual
  loss_weight_bc_wall: 1.0        # no-slip u(R,x)=0
  loss_weight_bc_wall_v: 1.0      # no radial flow v(R,x)=0
  loss_weight_bc_symmetry: 1.0    # du/dr(0,x)=0
  loss_weight_bc_inlet: 10.0      # flat inlet u(r,0)=U_in (higher weight: hard constraint)
  lr_scheduler: null
  lr_scheduler_params: {}
  hybrid_switch_epoch: null
  lbfgs_learning_rate: 0.1

run:
  seed: 42
  dtype: "float32"              # float32 sufficient; float64 not needed for 2D problem